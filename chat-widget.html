<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zami Mart — Customer Chat</title>
<script type="module" src="firebase-init.js"></script>
<script src="chat-system.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --teal: #063b3f;
  --teal-light: #0a5259;
  --orange: #FD4D02;
  --cream: #f6f5f0;
  --text: #1a2e2e;
  --text-muted: #8a9faa;
  --border: rgba(6,59,63,.1);
  --ease: cubic-bezier(.4,0,.2,1);
  font-family: 'Poppins', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; color: var(--text); font-size: 14px; }

/* ── Chat Fab Button ── */
.chat-widget-btn {
  position: fixed;
  bottom: 24px; right: 24px;
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--orange);
  border: none;
  cursor: pointer;
  box-shadow: 0 8px 28px -4px rgba(253,77,2,.45);
  display: flex; align-items: center; justify-content: center;
  transition: all .35s var(--ease);
  z-index: 9999;
}
.chat-widget-btn:hover { transform: scale(1.1); box-shadow: 0 12px 36px -4px rgba(253,77,2,.5); }
.chat-widget-btn.open { opacity: 0; pointer-events: none; transform: scale(0.75); }

.chat-btn-logo-wrap {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.chat-btn-logo { width: 38px; height: 38px; object-fit: contain; position: absolute; }
.chat-btn-logo-fallback {
  font-size: .65rem; font-weight: 900;
  color: var(--orange); letter-spacing: -.03em;
}

.chat-btn-status-dot {
  position: absolute; bottom: 3px; right: 3px;
  width: 14px; height: 14px; border-radius: 50%;
  border: 2.5px solid #fff;
  background: #22c55e;
  transition: background .3s;
}
.chat-btn-status-dot.offline { background: #94a3b8; }

.chat-unread-badge {
  position: absolute; top: -3px; right: -3px;
  background: #d6483a; color: #fff;
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .6rem; font-weight: 700;
  border: 2px solid #fff;
}

/* ── Chat Window ── */
.chat-widget-window {
  position: fixed;
  bottom: 96px; right: 24px;
  width: 380px;
  max-width: calc(100vw - 32px);
  height: 580px;
  background: #fff;
  border-radius: 22px;
  box-shadow: 0 20px 70px -10px rgba(6,59,63,.25), 0 4px 20px rgba(0,0,0,.08);
  display: none; flex-direction: column;
  z-index: 9998;
  overflow: hidden;
}
.chat-widget-window.open {
  display: flex;
  animation: chatSlideUp .3s var(--ease);
}
.chat-widget-window.closing {
  display: flex;
  animation: chatSlideDown .22s cubic-bezier(.4,0,1,1) forwards;
}
@keyframes chatSlideUp {
  from { transform: translateY(16px) scale(.97); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes chatSlideDown {
  from { transform: translateY(0) scale(1); opacity: 1; }
  to   { transform: translateY(16px) scale(.96); opacity: 0; }
}

/* ── Header ── */
.chat-header {
  padding: 14px 16px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 100%);
  color: #fff;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.chat-header-logo-circle {
  width: 42px; height: 42px; border-radius: 50%;
  background: rgba(255,255,255,.15);
  border: 2px solid rgba(255,255,255,.25);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative; flex-shrink: 0;
}
.chat-header-logo { width: 34px; height: 34px; object-fit: contain; position: absolute; }
.chat-header-logo-text { font-size: .65rem; font-weight: 900; color: #fff; }

.chat-header-status-dot-wrap { position: relative; flex-shrink: 0; }
.chat-header-status-dot {
  position: absolute; bottom: 0; right: 0;
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid var(--teal);
  background: #22c55e;
}
.chat-header-status-dot.offline { background: #94a3b8; }

.chat-header-info { flex: 1; }
.chat-header-title { font-size: .92rem; font-weight: 700; }
.chat-header-sub { font-size: .68rem; opacity: .8; margin-top: 1px; }

.chat-header-close {
  width: 30px; height: 30px; border-radius: 8px;
  background: rgba(255,255,255,.12);
  border: none; color: #fff; font-size: .85rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s;
  flex-shrink: 0;
}
.chat-header-close:hover { background: rgba(255,255,255,.22); }

/* ── Status pulse ── */
.chat-header-status-dot.active,
.chat-btn-status-dot.active {
  animation: statusPulse 2s ease-in-out infinite;
}
@keyframes statusPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,.5); }
  50%       { box-shadow: 0 0 0 5px rgba(34,197,94,0); }
}

/* ── Messages Area ── */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  background: #f8fafa;
  min-height: 0;
}
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: rgba(6,59,63,.12); border-radius: 4px; }

/* ── Date/Time Divider ── */
.chat-divider {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; flex-shrink: 0;
}
.chat-divider-line {
  flex: 1; height: 1px;
  background: rgba(6,59,63,.1);
}
.chat-divider-label {
  font-size: .63rem; color: var(--text-muted);
  font-weight: 500; white-space: nowrap;
  padding: 2px 8px;
  background: rgba(6,59,63,.06);
  border-radius: 20px;
}

/* ── Message Row ── */
.chat-message {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  max-width: 100%;
  animation: msgIn .2s var(--ease);
  margin-bottom: 2px;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Consecutive messages — less gap */
.chat-message + .chat-message.same-sender { margin-bottom: 0; }
.chat-message.same-sender .chat-message-bubble { margin-top: 2px; }

/* ── Avatar ── */
.chat-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .62rem; font-weight: 700;
  flex-shrink: 0; align-self: flex-end;
  overflow: hidden;
}
.chat-avatar.admin-av {
  background: var(--teal);
  color: #fff;
}
.chat-avatar.hidden { visibility: hidden; }

/* ── Bubble ── */
.chat-message-content {
  display: flex; flex-direction: column; gap: 2px;
  min-width: 0; max-width: 75%;
}

.chat-message-bubble {
  padding: 9px 13px;
  font-size: .81rem; line-height: 1.55;
  word-break: break-word; overflow-wrap: break-word;
  white-space: pre-wrap;
  width: fit-content; max-width: 100%;
  position: relative;
}

.chat-message-bubble.img-only {
  padding: 3px; background: #fff;
  box-shadow: 0 3px 14px -3px rgba(6,59,63,.22), 0 1px 3px rgba(0,0,0,.08);
  border: 1px solid rgba(6,59,63,.06);
}
.chat-message.visitor .chat-message-bubble.img-only {
  box-shadow: 0 3px 14px -3px rgba(253,77,2,.28), 0 1px 3px rgba(0,0,0,.08);
}
.chat-img-wrap {
  position: relative; display: block; overflow: hidden;
  border-radius: 13px; line-height: 0;
}
.chat-img-wrap + .chat-img-wrap { margin-top: 3px; }
img.chat-img {
  display: block; width: 100%; max-width: 190px; max-height: 190px;
  object-fit: cover; border-radius: inherit; cursor: zoom-in;
  transition: transform .25s ease;
}
.chat-img-wrap:hover img.chat-img { transform: scale(1.035); }
.chat-img-wrap::after {
  content: '\f065'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
  position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%;
  background: rgba(0,0,0,.42); color: #fff; font-size: .62rem;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .18s; pointer-events: none;
}
.chat-img-wrap:hover::after { opacity: 1; }

/* ── VISITOR (right, orange) ── */
.chat-message.visitor {
  flex-direction: row-reverse;
  justify-content: flex-start;
}
.chat-message.visitor .chat-message-content {
  align-items: flex-end;
}
.chat-message.visitor .chat-message-bubble {
  background: var(--orange);
  color: #fff;
  border-radius: 18px 18px 4px 18px;
  box-shadow: 0 2px 8px rgba(253,77,2,.2);
}
/* Consecutive visitor bubbles */
.chat-message.visitor.same-sender .chat-message-bubble {
  border-radius: 18px 4px 4px 18px;
}
.chat-message.visitor.last-in-group .chat-message-bubble {
  border-radius: 18px 4px 18px 18px;
}

/* ── ADMIN (left, dark) ── */
.chat-message.admin {
  flex-direction: row;
  justify-content: flex-start;
}
.chat-message.admin .chat-message-content {
  align-items: flex-start;
}
.chat-message.admin .chat-message-bubble {
  background: #fff;
  color: var(--text);
  border-radius: 18px 18px 18px 4px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
  border: 1px solid rgba(6,59,63,.07);
}
/* Consecutive admin bubbles */
.chat-message.admin.same-sender .chat-message-bubble {
  border-radius: 4px 18px 18px 4px;
}
.chat-message.admin.last-in-group .chat-message-bubble {
  border-radius: 4px 18px 18px 18px;
}

/* Time */
.chat-message-time {
  font-size: .6rem; color: var(--text-muted);
  padding: 0 3px; margin-top: 1px;
}
.chat-message.visitor .chat-message-time { text-align: right; }
.chat-message.admin .chat-message-time   { text-align: left; }

/* Edited tag (matches admin panel) */
.chat-edited-tag {
  font-size: .6rem; opacity: .55; font-style: italic;
  padding: 0 3px; margin-top: 1px;
}
.chat-message.visitor .chat-edited-tag { text-align: right; }
.chat-message.admin .chat-edited-tag   { text-align: left; }

/* ── Reaction badge(s) ── */
.chat-reaction-row {
  display: flex; gap: 3px; margin-top: 2px;
}
.chat-message.visitor .chat-reaction-row { align-self: flex-end; }
.chat-message.admin   .chat-reaction-row { align-self: flex-start; }
.chat-reaction {
  font-size: .85rem; line-height: 1;
  background: #fff; border: 1px solid rgba(6,59,63,.12);
  border-radius: 20px; padding: 1px 5px;
  box-shadow: 0 1px 4px rgba(0,0,0,.1);
  width: fit-content; user-select: none;
  animation: chatReactionPop .32s cubic-bezier(.34,1.56,.64,1);
  cursor: default; /* not yours: just a badge, not removable by you */
}
.chat-reaction.mine { cursor: pointer; } /* yours: tap to remove */
.chat-reaction.mine:hover { filter: brightness(.96); }
@keyframes chatReactionPop {
  0%   { transform: scale(0); opacity: 0; }
  55%  { transform: scale(1.35); opacity: 1; }
  100% { transform: scale(1); }
}

/* ── Emoji picker popup (widget) — Messenger-style bounce-in ── */
.chat-emoji-picker {
  position: fixed; z-index: 999999;
  background: #fff; border-radius: 24px; padding: 6px 8px;
  display: flex; gap: 3px;
  box-shadow: 0 8px 28px rgba(0,0,0,.22);
  animation: chatPickerIn .16s cubic-bezier(.34,1.56,.64,1);
  transform-origin: bottom center;
}
@keyframes chatPickerIn {
  0%   { transform: scale(.4); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.chat-emoji-picker button {
  border: none; background: none; font-size: 1.1rem; cursor: pointer;
  padding: 3px; border-radius: 50%; transition: transform .14s cubic-bezier(.34,1.56,.64,1), background .12s;
  line-height: 1;
  animation: chatPickerBtnIn .22s cubic-bezier(.34,1.56,.64,1) backwards;
}
.chat-emoji-picker button:nth-child(1) { animation-delay: .01s; }
.chat-emoji-picker button:nth-child(2) { animation-delay: .03s; }
.chat-emoji-picker button:nth-child(3) { animation-delay: .05s; }
.chat-emoji-picker button:nth-child(4) { animation-delay: .07s; }
.chat-emoji-picker button:nth-child(5) { animation-delay: .09s; }
.chat-emoji-picker button:nth-child(6) { animation-delay: .11s; }
@keyframes chatPickerBtnIn {
  0%   { transform: scale(0) translateY(6px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
.chat-emoji-picker button:hover { background: #f0f4f4; transform: scale(1.5) translateY(-6px); }
.chat-emoji-picker button.picked { animation: chatEmojiPicked .3s ease; }
@keyframes chatEmojiPicked {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.7); }
  100% { transform: scale(0); opacity: 0; }
}

/* ── Message actions (reply, react) — hidden until you hover (desktop)
   or tap the bubble (phone). Always-visible caused layout squeeze against
   tall bubbles (quotes) and neighboring sender labels. ── */
.chat-msg-actions {
  display: flex; align-items: center; gap: 2px;
  opacity: 0; transform: scale(.92);
  transition: opacity .12s ease, transform .12s ease;
  pointer-events: none;
  flex-shrink: 0;
  align-self: flex-end;
  margin-bottom: 2px;
}
.chat-message:hover .chat-msg-actions,
.chat-message.actions-pinned .chat-msg-actions {
  opacity: 1; transform: scale(1); pointer-events: all;
}
.chat-msg-actions button {
  width: 24px; height: 24px; border-radius: 50%;
  border: none; background: #fff; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
  font-size: .62rem; cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,.14);
  transition: background .12s, color .12s, transform .12s;
}
.chat-msg-actions button:hover { background: var(--teal); color: #fff; transform: translateY(-1px); }
@media (hover: none) {
  .chat-msg-actions { opacity: 0; }
  .chat-message.actions-pinned .chat-msg-actions { opacity: 1; pointer-events: all; }
}

/* Quoted "replying to" snippet shown inside a bubble */
.chat-reply-quote {
  font-size: .68rem; line-height: 1.3; padding: 4px 7px; margin-bottom: 4px;
  border-left: 3px solid rgba(255,255,255,.7);
  background: rgba(255,255,255,.16); border-radius: 5px;
  opacity: .92; max-height: 2.4em; overflow: hidden;
  cursor: pointer;
}
.chat-message.admin .chat-reply-quote {
  border-left-color: rgba(6,59,63,.35);
  background: rgba(6,59,63,.05);
}
.chat-reply-quote b { font-weight: 700; }

/* "Replying to ..." bar shown above the input while composing a reply */
.chat-reply-bar {
  display: none; align-items: center; gap: 8px;
  padding: 7px 12px; background: #f4f7f7;
  border-top: 1px solid var(--border); border-left: 3px solid var(--orange);
  font-size: .7rem; color: var(--text-muted);
  flex-shrink: 0;
}
.chat-reply-bar.show { display: flex; }
.chat-reply-bar-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-reply-bar-text b { color: var(--teal); }
.chat-reply-bar-close {
  border: none; background: none; cursor: pointer; color: var(--text-muted);
  font-size: .78rem; padding: 2px 6px;
}
.chat-reply-bar-close:hover { color: #d63030; }

/* ── Sender label (first in group) ── */
.chat-sender-label {
  font-size: .6rem; font-weight: 600;
  color: var(--text-muted);
  padding: 0 4px; margin-bottom: 1px;
}

/* ── Welcome / Wave Screen ── */
.chat-welcome {
  display: flex; flex-direction: column;
  align-items: center; text-align: center;
  padding: 18px 20px 10px;
  flex-shrink: 0;
}
.chat-wave-emoji {
  font-size: 2.2rem;
  animation: wave 1.8s ease-in-out 2;
  display: inline-block;
  transform-origin: 70% 70%;
  margin-bottom: 6px;
}
@keyframes wave {
  0%,60%,100% { transform: rotate(0deg); }
  10%,30%     { transform: rotate(14deg); }
  20%         { transform: rotate(-4deg); }
  40%         { transform: rotate(10deg); }
  50%         { transform: rotate(-2deg); }
}
.chat-welcome h3 {
  font-size: .95rem; font-weight: 700;
  color: var(--teal); margin-bottom: 4px;
}
.chat-welcome p {
  font-size: .76rem; color: var(--text-muted);
  line-height: 1.5; margin-bottom: 14px;
}

.chat-welcome-form {
  width: 100%; display: flex; flex-direction: column; gap: 8px;
}
.chat-welcome-form input {
  padding: 10px 13px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: .82rem; font-family: inherit;
  outline: none; transition: all .2s var(--ease);
  background: #f8fafa;
}
.chat-welcome-form input:focus {
  border-color: var(--teal);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(6,59,63,.07);
}
.chat-welcome-form input.chat-input-error {
  border-color: #e0342c;
  background: #fff5f4;
}
.chat-welcome-form input.chat-input-error:focus {
  box-shadow: 0 0 0 3px rgba(224,52,44,.12);
}
.chat-welcome-form-error {
  color: #e0342c;
  font-size: .72rem;
  margin: -4px 0 0 2px;
  display: none;
}
.chat-welcome-form-error.show { display: block; }
.chat-welcome-form button {
  padding: 10px 16px;
  background: var(--orange); color: #fff;
  border: none; border-radius: 10px;
  font-size: .82rem; font-weight: 600;
  cursor: pointer; transition: all .2s var(--ease);
}
.chat-welcome-form button:hover {
  background: #e34602; transform: translateY(-1px);
}

/* ── "or" divider ── */
.chat-welcome-divider {
  display: flex; align-items: center; gap: 10px;
  width: 100%; margin: 12px 0 10px;
}
.chat-welcome-divider::before,
.chat-welcome-divider::after {
  content: ''; flex: 1; height: 1px;
  background: rgba(6,59,63,.1);
}
.chat-welcome-divider span {
  font-size: .64rem; font-weight: 600;
  color: var(--text-muted); letter-spacing: .04em;
  text-transform: uppercase;
}

/* ── Viber CTA button ── */
.chat-viber-cta {
  position: relative;
  width: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-radius: 12px;
  text-decoration: none;
  background: linear-gradient(135deg, #7360f2 0%, #59267c 100%);
  box-shadow: 0 6px 18px -4px rgba(115,96,242,.45);
  overflow: hidden;
  isolation: isolate;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease);
  animation: viberPulse 2.4s ease-in-out infinite;
}
.chat-viber-cta:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 26px -4px rgba(115,96,242,.55);
}
.chat-viber-cta:active { transform: translateY(0); }

/* shimmer sweep */
.chat-viber-cta::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 48%, transparent 66%);
  background-size: 220% 100%;
  background-position: 150% 0;
  animation: viberShimmer 2.8s ease-in-out infinite;
  z-index: 1;
  pointer-events: none;
}
@keyframes viberShimmer {
  0%   { background-position: 150% 0; }
  55%  { background-position: -50% 0; }
  100% { background-position: -50% 0; }
}
@keyframes viberPulse {
  0%, 100% { box-shadow: 0 6px 18px -4px rgba(115,96,242,.45); }
  50%      { box-shadow: 0 6px 22px -2px rgba(115,96,242,.7); }
}

.chat-viber-cta-icon {
  position: relative; z-index: 2;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(255,255,255,.18);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: .95rem;
  flex-shrink: 0;
  animation: viberIconBounce 2.4s ease-in-out infinite;
}
@keyframes viberIconBounce {
  0%, 100% { transform: scale(1) rotate(0deg); }
  10%      { transform: scale(1.12) rotate(-8deg); }
  20%      { transform: scale(1) rotate(4deg); }
  30%      { transform: scale(1) rotate(0deg); }
}

.chat-viber-cta-text {
  position: relative; z-index: 2;
  flex: 1;
  color: #fff; font-size: .82rem; font-weight: 600;
  text-align: left;
}
.chat-viber-cta-sub {
  display: block;
  font-size: .62rem; font-weight: 400;
  color: rgba(255,255,255,.75);
  margin-top: 1px;
}
.chat-viber-cta-arrow {
  position: relative; z-index: 2;
  color: #fff; font-size: .72rem;
  display: flex; align-items: center; justify-content: center;
  transition: transform .25s var(--ease);
}
.chat-viber-cta:hover .chat-viber-cta-arrow { transform: translateX(3px); }

/* ── Suggestion Chips ── */
.chat-suggestions {
  padding: 8px 14px 10px;
  display: flex; flex-wrap: wrap; gap: 6px;
  flex-shrink: 0;
  border-top: 1px solid rgba(6,59,63,.07);
  background: #f8fafa;
}
.chat-suggestions-label {
  width: 100%;
  font-size: .63rem; color: var(--text-muted); font-weight: 600;
  margin-bottom: 2px; letter-spacing: .02em;
}
.chat-chip {
  padding: 5px 12px;
  border: 1.5px solid rgba(6,59,63,.15);
  border-radius: 20px;
  font-size: .72rem; font-weight: 500;
  color: var(--teal); cursor: pointer;
  background: #fff;
  transition: all .18s var(--ease);
  font-family: inherit;
  white-space: nowrap;
}
.chat-chip:hover {
  background: var(--teal); color: #fff;
  border-color: var(--teal);
  transform: translateY(-1px);
  box-shadow: 0 3px 10px rgba(6,59,63,.2);
}

/* ── Input Area ── */
.chat-input-area {
  padding: 10px 12px;
  border-top: 1px solid rgba(6,59,63,.08);
  display: flex; gap: 8px; align-items: flex-end;
  background: #fff;
  flex-shrink: 0;
}
.chat-img-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: #f0f4f4; border: 1px solid var(--border);
  color: var(--text-muted); font-size: .82rem;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all .2s; flex-shrink: 0;
}
.chat-img-btn:hover { background: #ddeaea; color: var(--teal); }
.chat-img-btn:disabled { opacity: .55; cursor: not-allowed; }

/* ── File attachment card (non-image files) ── */
.zm-file-attach {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: 10px;
  background: rgba(6,59,63,.06);
  text-decoration: none; color: inherit;
  max-width: 200px;
}
.zm-file-attach i { font-size: 1.3rem; color: var(--teal); flex-shrink: 0; }
.zm-file-attach-info { min-width: 0; display: flex; flex-direction: column; }
.zm-file-attach-name {
  font-size: .78rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.zm-file-attach-size { font-size: .65rem; opacity: .6; }

.chat-input {
  flex: 1; padding: 9px 13px;
  border: 1.5px solid var(--border); border-radius: 18px;
  font-size: .81rem; font-family: inherit;
  outline: none; resize: none;
  max-height: 80px; min-height: 36px;
  overflow-y: auto; line-height: 1.4;
  transition: border-color .2s, box-shadow .2s;
  background: #f8fafa;
}
.chat-input:focus {
  border-color: var(--teal); background: #fff;
  box-shadow: 0 0 0 3px rgba(6,59,63,.07);
}

.chat-send-btn {
  width: 36px; height: 36px; border-radius: 12px;
  background: var(--orange); border: none;
  color: #fff; font-size: .82rem;
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all .2s; flex-shrink: 0;
}
.chat-send-btn:hover { background: #e34602; transform: scale(1.07); }
.chat-send-btn:active { transform: scale(.93); }

/* ── Typing indicator ── */
.chat-typing {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 0;
}
.chat-typing-dots {
  display: flex; gap: 3px; padding: 8px 12px;
  background: #fff; border-radius: 18px;
  border: 1px solid rgba(6,59,63,.07);
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.chat-typing-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-muted);
  animation: typingBounce 1.2s ease-in-out infinite;
}
.chat-typing-dots span:nth-child(2) { animation-delay: .15s; }
.chat-typing-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes typingBounce {
  0%,60%,100% { transform: translateY(0); opacity:.4; }
  30%         { transform: translateY(-5px); opacity:1; }
}







/* Mobile — floating bubble card, NOT full-screen. Leaves margin on
   all four sides so the page behind (catalog, etc.) stays visible. */
@media (max-width: 600px) {
  .chat-widget-window {
    top: 36px;
    bottom: 96px;
    left: 18px; right: 18px;
    width: auto; max-width: none;
    height: auto;
    max-height: none;
    border-radius: 24px;
  }
  .chat-widget-btn { bottom: 18px; right: 18px; }
}

/* Extra-short phones: trim margins a touch so the card doesn't feel cramped. */
@media (max-width: 600px) and (max-height: 700px) {
  .chat-widget-window { top: 24px; bottom: 84px; }
}
</style>
</head>
<body>

<!-- Chat FAB -->
<button class="chat-widget-btn" id="chatWidgetBtn" title="Chat with us">
  <div class="chat-btn-logo-wrap">
    <img src="img/logo.png" alt="Zami Mart" class="chat-btn-logo" onerror="this.style.display='none'">
    <span class="chat-btn-logo-fallback">ZM</span>
  </div>
  <div class="chat-unread-badge" id="chatUnreadBadge" style="display:none;">0</div>
  <div class="chat-btn-status-dot" id="chatBtnStatusDot"></div>
</button>

<!-- Chat Window -->
<div class="chat-widget-window" id="chatWindow">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-status-dot-wrap">
      <div class="chat-header-logo-circle">
        <img src="img/logo.png" alt="Zami Mart" class="chat-header-logo" onerror="this.style.display='none'">
        <span class="chat-header-logo-text">ZM</span>
      </div>
      <div class="chat-header-status-dot" id="chatStatusDot"></div>
    </div>
    <div class="chat-header-info">
      <div class="chat-header-title">Zami Mart Support</div>
      <div class="chat-header-sub" id="chatHeaderStatus">Checking status…</div>
    </div>
    <button class="chat-header-close" id="chatCloseBtn"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <!-- Welcome shown before session starts -->
    <div class="chat-welcome" id="chatWelcomeBlock">
      <div class="chat-wave-emoji">👋</div>
      <h3>Hi there! How can we help?</h3>
      <p>We usually reply within minutes. Fill in your details below to get started.</p>
      <form class="chat-welcome-form" id="chatWelcomeForm">
        <input type="text" id="visitorName" placeholder="Your name" required autocomplete="name">
        <input type="tel" id="visitorPhone" placeholder="Phone number" required autocomplete="tel">
        <div class="chat-welcome-form-error" id="visitorPhoneError">Please enter a valid Maldives phone number.</div>
        <button type="submit">Start Chatting <i class="fa-solid fa-arrow-right" style="margin-left:4px;font-size:.75rem;"></i></button>
      </form>

      <div class="chat-welcome-divider"><span>or</span></div>

      <a href="#" id="chatWelcomeViberBtn" class="chat-viber-cta" target="_blank" rel="noopener">
        <span class="chat-viber-cta-icon"><i class="fa-brands fa-viber"></i></span>
        <span class="chat-viber-cta-text">Chat with us on Viber
          <span class="chat-viber-cta-sub">Click to direct chatting in viber</span>
        </span>
        <span class="chat-viber-cta-arrow"><i class="fa-solid fa-arrow-right"></i></span>
      </a>
    </div>
  </div>


  <!-- Quick Suggestions (shown after session starts) -->
  <div class="chat-suggestions" id="chatSuggestions" style="display:none;">
    <div class="chat-suggestions-label">QUICK QUESTIONS</div>
    <button class="chat-chip" onclick="sendChip(this)">👋 Hi there!</button>
    <button class="chat-chip" onclick="sendChip(this)">🛒 How to order?</button>
    <button class="chat-chip" onclick="sendChip(this)">📞 Contact details</button>
  </div>

  <!-- Replying-to bar -->
  <div class="chat-reply-bar" id="chatReplyBar">
    <div class="chat-reply-bar-text">Replying to <b id="chatReplyBarName"></b>: <span id="chatReplyBarText"></span></div>
    <button class="chat-reply-bar-close" id="chatReplyBarClose" title="Cancel reply"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <!-- Input -->
  <div class="chat-input-area" id="chatInputArea">
    <div class="chat-attach-wrap" id="chatAttachWrap" style="display:none;">
      <button class="chat-img-btn" id="chatImgBtn" title="Send photo (max 15MB)">
        <i class="fa-solid fa-paperclip"></i>
      </button>
      <div class="chat-attach-menu" id="chatAttachMenu">
        <button type="button" data-kind="photo"><i class="fa-solid fa-image"></i> Photo</button>
      </div>
    </div>
    <input type="file" id="chatPhotoInput" accept="image/*" style="display:none;">
    <textarea class="chat-input" id="chatInput" placeholder="Type a message…" rows="1" style="display:none;"></textarea>
    <button class="chat-send-btn" id="chatSendBtn" style="display:none;">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
</div>

<style>
.chat-attach-wrap { position: relative; flex-shrink: 0; }
.chat-attach-menu {
  display: none; position: absolute; bottom: 44px; left: 0;
  background: #fff; border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 8px 24px -6px rgba(0,0,0,.18); overflow: hidden;
  min-width: 130px; z-index: 20;
}
.chat-attach-menu.show { display: block; }
.chat-attach-menu button {
  width: 100%; display: flex; align-items: center; gap: 9px;
  padding: 10px 13px; border: none; background: none; cursor: pointer;
  font-family: inherit; font-size: .8rem; color: var(--text); text-align: left;
}
.chat-attach-menu button i { color: var(--teal); width: 16px; text-align: center; }
.chat-attach-menu button:hover { background: #f0f4f4; }
</style>

<script>
// TODO: palitan ng tunay na Viber number ni Zami Mart (country code + number, walang + o 0 sa harap)
// halimbawa: '9171234567'
const VIBER_NUMBER = '9609906025';
const chatWelcomeViberBtn = document.getElementById('chatWelcomeViberBtn');
if (chatWelcomeViberBtn) {
  chatWelcomeViberBtn.href = `viber://chat?number=%2B${VIBER_NUMBER}`;
}

const chatBtn        = document.getElementById('chatWidgetBtn');
const chatWindow     = document.getElementById('chatWindow');
const chatCloseBtn   = document.getElementById('chatCloseBtn');
const chatMessages   = document.getElementById('chatMessages');
const chatInput      = document.getElementById('chatInput');
const chatSendBtn    = document.getElementById('chatSendBtn');
const chatImgBtn     = document.getElementById('chatImgBtn');
const chatAttachWrap = document.getElementById('chatAttachWrap');
const chatAttachMenu = document.getElementById('chatAttachMenu');
const chatPhotoInput = document.getElementById('chatPhotoInput');
const chatFileInput  = document.getElementById('chatFileInput');
const chatWelcomeForm  = document.getElementById('chatWelcomeForm');
const chatWelcomeBlock = document.getElementById('chatWelcomeBlock');
const chatSuggestions  = document.getElementById('chatSuggestions');
const unreadBadge    = document.getElementById('chatUnreadBadge');

let currentSessionId = null;
let visitorName      = null;
let _lastSeenAdminMsgCount = 0;
let widgetReplyTarget = null;

const chatReplyBar      = document.getElementById('chatReplyBar');
const chatReplyBarName  = document.getElementById('chatReplyBarName');
const chatReplyBarText  = document.getElementById('chatReplyBarText');
const chatReplyBarClose = document.getElementById('chatReplyBarClose');

function startWidgetReplyTo(msgId) {
  const msg = ChatSystem.getSessionMessages(currentSessionId).find(m => m.id === msgId);
  if (!msg || msg.deleted) return;
  closeWidgetEmojiPicker();
  unpinAllWidgetActions();
  widgetReplyTarget = {
    id: msg.id,
    senderName: msg.senderType === 'visitor' ? 'You' : 'Zami Mart',
    text: msg.text ? msg.text.slice(0, 80) : (msg.imageData ? '📷 Photo' : (msg.attachment ? '📎 ' + msg.attachment.name : ''))
  };
  chatReplyBarName.textContent = widgetReplyTarget.senderName;
  chatReplyBarText.textContent = widgetReplyTarget.text;
  chatReplyBar.classList.add('show');
  chatInput.focus();
}
function cancelWidgetReplyTo() {
  widgetReplyTarget = null;
  chatReplyBar.classList.remove('show');
}
chatReplyBarClose.addEventListener('click', cancelWidgetReplyTo);

function scrollToWidgetMsg(msgId) {
  const el = document.querySelector(`#chatMessages [data-msgid="${msgId}"]`);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const bubble = el.querySelector('.chat-message-bubble');
  if (!bubble) return;
  bubble.style.transition = 'background-color .3s, box-shadow .3s';
  const prevShadow = bubble.style.boxShadow;
  bubble.style.boxShadow = '0 0 0 2px var(--orange)';
  setTimeout(() => { bubble.style.boxShadow = prevShadow; }, 700);
}

// Mobile long-press: pin the reply/react icons so they're tappable
function unpinAllWidgetActions() {
  document.querySelectorAll('.chat-message.actions-pinned').forEach(el => el.classList.remove('actions-pinned'));
}
document.addEventListener('click', e => {
  if (!e.target.closest('.chat-msg-actions') && !e.target.closest('.chat-emoji-picker')) unpinAllWidgetActions();
});

// ── SOUNDS ──
function _playSendSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(600, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.1);
    g.gain.setValueAtTime(0.1, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    o.start(); o.stop(ctx.currentTime + 0.2);
  } catch(e) {}
}
function _playReceiveSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1100].forEach((freq, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      const t = ctx.currentTime + i * 0.12;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.start(t); o.stop(t + 0.22);
    });
  } catch(e) {}
}

// ── OPEN / CLOSE ──
function openChatWindow() {
  chatWindow.classList.remove('closing');
  chatWindow.classList.add('open');
  chatBtn.classList.add('open');
  if (currentSessionId) {
    chatInput.focus();
    ChatSystem.markSessionAsRead(currentSessionId);
    unreadBadge.style.display = 'none';
    const msgs = ChatSystem.getSessionMessages(currentSessionId);
    _lastSeenAdminMsgCount = msgs.filter(m => m.senderType === 'admin').length;
  }
}
function closeChatWindow() {
  if (!chatWindow.classList.contains('open')) return;
  chatWindow.classList.remove('open');
  chatBtn.classList.remove('open');
  chatWindow.classList.add('closing');
  setTimeout(() => { chatWindow.classList.remove('closing'); }, 220);
}
chatBtn.addEventListener('click', () => {
  if (chatWindow.classList.contains('open')) closeChatWindow();
  else openChatWindow();
});
chatCloseBtn.addEventListener('click', closeChatWindow);

// ── WELCOME FORM ──
chatWelcomeForm.addEventListener('submit', e => {
  e.preventDefault();
  const name  = document.getElementById('visitorName').value.trim();
  const phoneInput = document.getElementById('visitorPhone');
  const phoneErrorEl = document.getElementById('visitorPhoneError');
  const phone = phoneInput.value.trim();
  if (!name) { document.getElementById('visitorName').focus(); return; }

  const digits = phone.replace(/\D/g, '');
  const local = (digits.startsWith('960') && digits.length > 7) ? digits.slice(3) : digits;
  const isValidMaldivesPhone = /^[3679]\d{6}$/.test(local);
  if (!isValidMaldivesPhone) {
    phoneInput.classList.add('chat-input-error');
    if (phoneErrorEl) phoneErrorEl.classList.add('show');
    phoneInput.focus();
    return;
  }
  phoneInput.classList.remove('chat-input-error');
  if (phoneErrorEl) phoneErrorEl.classList.remove('show');

  visitorName      = name;
  currentSessionId = ChatSystem.createSession(name, phone);
  _activateChat();
  saveSession();
  chatInput.focus();
});

function _activateChat() {
  // Remove welcome from messages area
  chatWelcomeBlock.style.display = 'none';
  // Show input controls
  chatInput.style.display       = 'block';
  chatSendBtn.style.display     = 'flex';
  chatAttachWrap.style.display  = 'block';
  // Show suggestion chips
  chatSuggestions.style.display = 'flex';
  renderMessages();
}

// ── SUGGESTION CHIPS ──
window.sendChip = function(btn) {
  const text = btn.textContent.trim().replace(/^[\p{Emoji}\s]+/u, '').trim();
  if (!text || !currentSessionId) return;
  ChatSystem.sendMessage(currentSessionId, 'visitor', visitorName, btn.textContent.trim());
  _playSendSound();
  renderMessages();
  chatSuggestions.style.display = 'none';
};

// ── SEND ──
chatSendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = this.scrollHeight + 'px';
});

chatImgBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  chatAttachMenu.classList.toggle('show');
});
chatAttachMenu.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-kind]');
  if (!btn) return;
  chatAttachMenu.classList.remove('show');
  if (btn.dataset.kind === 'photo') chatPhotoInput.click();
  else chatFileInput.click();
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.chat-attach-wrap')) chatAttachMenu.classList.remove('show');
});

function _handleChatAttachFile(file) {
  if (!file || !currentSessionId) return;

  if (file.size > ChatSystem.MAX_ATTACHMENT_SIZE) {
    alert('Masyadong malaki ang file (max 15MB). Pumili ng mas maliit na file.');
    return;
  }

  const isImage = file.type && file.type.startsWith('image/');
  chatImgBtn.disabled = true;
  chatImgBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

  ChatSystem.uploadAttachment(file, currentSessionId)
    .then(att => {
      if (isImage) {
        ChatSystem.sendMessage(currentSessionId, 'visitor', visitorName, '', att.url);
      } else {
        ChatSystem.sendMessage(currentSessionId, 'visitor', visitorName, '', null, null, att);
      }
      _playSendSound();
      chatSuggestions.style.display = 'none';
      renderMessages();
    })
    .catch(() => {
      alert('Hindi na-send ang file. Subukan ulit.');
    })
    .finally(() => {
      chatImgBtn.disabled = false;
      chatImgBtn.innerHTML = '<i class="fa-solid fa-paperclip"></i>';
    });
}

chatPhotoInput.addEventListener('change', () => {
  _handleChatAttachFile(chatPhotoInput.files[0]);
  chatPhotoInput.value = '';
});
chatFileInput.addEventListener('change', () => {
  _handleChatAttachFile(chatFileInput.files[0]);
  chatFileInput.value = '';
});

function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || !currentSessionId) return;
  ChatSystem.sendMessage(currentSessionId, 'visitor', visitorName, text, null, widgetReplyTarget);
  _playSendSound();
  chatInput.value = '';
  chatInput.style.height = 'auto';
  chatSuggestions.style.display = 'none';
  cancelWidgetReplyTo();
  renderMessages();
}

// ── RENDER ──
function renderMessages() {
  if (!currentSessionId) return;
  const messages = ChatSystem.getSessionMessages(currentSessionId)
    .filter(m => !m.deleted);

  // Group messages by sender to apply consecutive bubble styling
  const rows = messages.map((msg, i) => {
    const prev = messages[i - 1];
    const next = messages[i + 1];
    const samePrev = prev && prev.senderType === msg.senderType;
    const sameNext = next && next.senderType === msg.senderType;
    return { msg, isFirst: !samePrev, isLast: !sameNext };
  });

  const todayStr  = _dayLabel(new Date());
  let lastDivider = null;

  chatMessages.innerHTML = '';

  rows.forEach(({ msg, isFirst, isLast }) => {
    const msgDate   = new Date(msg.timestamp);
    const dayLabel  = _dayLabel(msgDate);

    // Date divider
    if (dayLabel !== lastDivider) {
      lastDivider = dayLabel;
      const div = document.createElement('div');
      div.className = 'chat-divider';
      div.innerHTML = `<div class="chat-divider-line"></div><div class="chat-divider-label">${dayLabel}</div><div class="chat-divider-line"></div>`;
      chatMessages.appendChild(div);
    }

    const isAdmin  = msg.senderType === 'admin';
    const time     = msgDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const bubbleContent = msg.imageData
      ? `<div class="chat-img-wrap"><img src="${msg.imageData}" alt="image" class="chat-img" data-src="${msg.imageData}"></div>`
      : msg.attachment
      ? ChatSystem.renderAttachmentHtml(msg.attachment)
      : escapeHtml(msg.text);
    const bubbleCls = 'chat-message-bubble' + (msg.imageData ? ' img-only' : '');

    const el = document.createElement('div');
    el.className = [
      'chat-message',
      isAdmin ? 'admin' : 'visitor',
      !isFirst  ? 'same-sender' : '',
      isLast && !isFirst ? 'last-in-group' : ''
    ].filter(Boolean).join(' ');

    const reactionH = _reactionBadgesHtml(msg);
    const quoteH = msg.replyTo
      ? `<div class="chat-reply-quote" data-refid="${msg.replyTo.id}"><b>${escapeHtml(msg.replyTo.senderName||'')}</b>: ${escapeHtml(msg.replyTo.text||'')}</div>`
      : '';
    const editedH = msg.edited
      ? `<div class="chat-edited-tag">edited</div>`
      : '';
    const actionsH = `
      <div class="chat-msg-actions">
        <button class="chat-act-reply" title="Reply"><i class="fa-solid fa-reply"></i></button>
        <button class="chat-act-react" title="React"><i class="fa-regular fa-face-smile"></i></button>
      </div>`;

    el.dataset.msgid = msg.id;

    if (isAdmin) {
      el.innerHTML = `
        <div class="chat-avatar admin-av ${isLast ? '' : 'hidden'}" title="Zami Mart">ZM</div>
        <div class="chat-message-content">
          ${isFirst ? '<div class="chat-sender-label">Zami Mart</div>' : ''}
          <div class="${bubbleCls}">${quoteH}${bubbleContent}</div>
          ${reactionH}
          ${editedH}
          ${isLast ? `<div class="chat-message-time">${time}</div>` : ''}
        </div>
        ${actionsH}`;
    } else {
      el.innerHTML = `
        <div class="chat-message-content">
          <div class="${bubbleCls}">${quoteH}${bubbleContent}</div>
          ${reactionH}
          ${editedH}
          ${isLast ? `<div class="chat-message-time">${time}</div>` : ''}
        </div>
        ${actionsH}`;
    }

    // Right-click (desktop) or long-press (phone) opens the emoji picker
    // directly. A plain single TAP/click on the bubble just reveals/hides
    // the Reply + React icons — no hold needed on phone.
    const bubble = el.querySelector('.chat-message-bubble');
    let _lpTimer = null, _lpFired = false;
    bubble.addEventListener('contextmenu', ev => { ev.preventDefault(); openWidgetEmojiPicker(ev, msg.id, isAdmin); });
    bubble.addEventListener('touchstart',  () => {
      _lpFired = false;
      _lpTimer = setTimeout(() => {
        _lpFired = true;
        unpinAllWidgetActions();
        el.classList.add('actions-pinned');
        if (navigator.vibrate) navigator.vibrate(15);
      }, 450);
    }, { passive: true });
    bubble.addEventListener('touchend',    () => clearTimeout(_lpTimer));
    bubble.addEventListener('touchmove',   () => { clearTimeout(_lpTimer); _lpFired = true; }, { passive: true });
    bubble.addEventListener('click', e => {
      if (_lpFired) return; // long-press already opened the picker — don't also toggle
      e.stopPropagation(); // keep the global "click elsewhere closes it" listener from undoing this same tap
      const wasPinned = el.classList.contains('actions-pinned');
      unpinAllWidgetActions();
      if (!wasPinned) el.classList.add('actions-pinned');
    });

    // Tap YOUR OWN reaction badge to toggle it off. Tapping the other
    // party's reaction badge does nothing — you can't remove their reaction.
    el.querySelectorAll('.chat-reaction').forEach(badge => {
      if (badge.dataset.owner === 'visitor' || badge.dataset.owner === 'legacy') {
        badge.classList.add('mine');
        badge.title = 'Remove reaction';
        badge.addEventListener('click', () => {
          ChatSystem.reactToMessage(badge.dataset.msgid, badge.dataset.em, badge.dataset.owner === 'legacy' ? 'legacy' : 'visitor');
          renderMessages();
        });
      } else {
        badge.title = '';
      }
    });

    // Reply / react hover-action buttons
    const replyBtn = el.querySelector('.chat-act-reply');
    const reactBtn = el.querySelector('.chat-act-react');
    if (replyBtn) replyBtn.addEventListener('click', e => { e.stopPropagation(); startWidgetReplyTo(msg.id); });
    if (reactBtn) reactBtn.addEventListener('click', e => { e.stopPropagation(); openWidgetEmojiPicker(e, msg.id, isAdmin, e.currentTarget.closest('.chat-message').querySelector('.chat-message-bubble')); });

    // Click a quoted reply snippet to jump to the original message
    const quote = el.querySelector('.chat-reply-quote');
    if (quote) quote.addEventListener('click', e => { e.stopPropagation(); scrollToWidgetMsg(quote.dataset.refid); });

    chatMessages.appendChild(el);
  });

  chatMessages.scrollTop = chatMessages.scrollHeight;
}

// ── Widget emoji picker ──────────────────────────
const WIDGET_QUICK_EMOJIS = ['👍','❤️','😂','😮','😢','🙏'];
let _widgetEmojiPicker = null;
function closeWidgetEmojiPicker() { if (_widgetEmojiPicker) { _widgetEmojiPicker.remove(); _widgetEmojiPicker = null; } }
document.addEventListener('click', closeWidgetEmojiPicker);

function openWidgetEmojiPicker(e, msgId, isAdmin, anchorEl) {
  if (e) e.preventDefault();
  closeWidgetEmojiPicker();
  const anchor = anchorEl || (e && e.currentTarget) || document.querySelector(`[data-msgid="${msgId}"] .chat-message-bubble`);
  if (!anchor) return;
  const rect = anchor.getBoundingClientRect();

  const picker = document.createElement('div');
  picker.className = 'chat-emoji-picker';
  picker.innerHTML = WIDGET_QUICK_EMOJIS.map(em => `<button data-em="${em}">${em}</button>`).join('');
  document.body.appendChild(picker);
  const pw = picker.offsetWidth;
  const ph = picker.offsetHeight;
  // Align to the same side as the bubble
  let left = isAdmin ? rect.right - pw : rect.left;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  const top = Math.max(8, rect.top - ph - 6);
  picker.style.left = left + 'px';
  picker.style.top  = top + 'px';
  _widgetEmojiPicker = picker;

  picker.addEventListener('click', ev => {
    const btn = ev.target.closest('button[data-em]');
    if (!btn) return;
    ev.stopPropagation();
    btn.classList.add('picked');
    ChatSystem.reactToMessage(msgId, btn.dataset.em, 'visitor');
    setTimeout(() => { closeWidgetEmojiPicker(); renderMessages(); }, 130);
  });
}

function _reactionBadgesHtml(msg) {
  if (msg.deleted) return '';
  const reactions = msg.reactions || (msg.reaction ? { legacy: msg.reaction } : {});
  const entries = Object.entries(reactions).filter(([, em]) => em);
  if (!entries.length) return '';
  return `<div class="chat-reaction-row">` + entries.map(([owner, em]) =>
    `<div class="chat-reaction" data-msgid="${msg.id}" data-em="${em}" data-owner="${owner}">${em}</div>`
  ).join('') + `</div>`;
}

function _dayLabel(date) {
  const today = new Date();
  const d = new Date(date);
  const diff = Math.floor((new Date(today.toDateString()) - new Date(d.toDateString())) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ── SESSION SAVE / RESTORE ──
function saveSession() {
  if (currentSessionId && visitorName) {
    localStorage.setItem('zm_cv_session', JSON.stringify({ id: currentSessionId, name: visitorName }));
  }
}
function restoreSession() {
  const stored = localStorage.getItem('zm_cv_session');
  if (!stored) return false;
  try {
    const s = JSON.parse(stored);
    if (s && s.id && ChatSystem.getSession(s.id)) {
      currentSessionId = s.id;
      visitorName      = s.name;
      _activateChat();
      const msgs = ChatSystem.getSessionMessages(currentSessionId);
      const hasVisitorMsg = msgs.some(m => m.senderType === 'visitor');
      if (hasVisitorMsg) chatSuggestions.style.display = 'none';
      _lastSeenAdminMsgCount = msgs.filter(m => m.senderType === 'admin').length;
      return true;
    }
  } catch(e) { console.warn(e); }
  return false;
}

// ── STATUS ──
function updateChatStatus() {
  const now  = new Date();
  const utc  = now.getTime() + now.getTimezoneOffset() * 60000;
  const mv   = new Date(utc + 5 * 3600000);
  const isOpen = mv.getDay() >= 1 && mv.getDay() <= 6 && mv.getHours() >= 8 && mv.getHours() < 21;

  const hdr = document.getElementById('chatHeaderStatus');
  const hDot = document.getElementById('chatStatusDot');
  const bDot = document.getElementById('chatBtnStatusDot');

  if (isOpen) {
    hdr.textContent = '● Active now';
    hdr.style.color = '#86efac';
    hDot.classList.remove('offline'); hDot.classList.add('active');
    bDot.classList.remove('offline'); bDot.classList.add('active');
  } else {
    hdr.textContent = 'Offline — leave a message';
    hdr.style.color = 'rgba(255,255,255,.6)';
    hDot.classList.add('offline'); hDot.classList.remove('active');
    bDot.classList.add('offline'); bDot.classList.remove('active');
  }
}
updateChatStatus();
setInterval(updateChatStatus, 60000);

// ── INIT ──
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ── ACCOUNT-LINKED SESSION ──
// If the customer is logged in, tie their chat to their account (email) so
// the SAME conversation/history shows up again whenever they log back in —
// on this device or any other — instead of starting a blank guest chat.
let _lastAuthUid = undefined; // undefined = not checked yet, null = logged out, string = uid
function _resetToGuestWidget() {
  currentSessionId = null;
  visitorName      = null;
  chatWelcomeBlock.style.display = 'block';
  chatInput.style.display   = 'none';
  chatSendBtn.style.display = 'none';
  chatAttachWrap.style.display  = 'none';
  chatSuggestions.style.display = 'none';
  chatMessages.innerHTML = '';
  unreadBadge.style.display = 'none';
  document.getElementById('visitorName').value  = '';
  document.getElementById('visitorPhone').value = '';
}
function _initSessionForAuthUser(user) {
  const uid = user ? user.uid : null;
  if (uid === _lastAuthUid) return; // no real change
  _lastAuthUid = uid;

  if (user) {
    const name = user.displayName || (user.email ? user.email.split('@')[0] : 'Customer');
    visitorName      = name;
    currentSessionId = ChatSystem.createSession(name, user.email || '');
    _activateChat();
    const msgs = ChatSystem.getSessionMessages(currentSessionId);
    const hasVisitorMsg = msgs.some(m => m.senderType === 'visitor');
    if (hasVisitorMsg) chatSuggestions.style.display = 'none';
    _lastSeenAdminMsgCount = msgs.filter(m => m.senderType === 'admin').length;
    saveSession();
  } else {
    // Logged out / guest: don't show any account's chat — fall back to whatever
    // is saved for this browser as a guest, or the blank name/number form.
    if (!restoreSession()) _resetToGuestWidget();
  }
}

ChatSystem.onReady(() => {
  function _watchAuth() {
    window.fb.onAuthStateChanged(window.fb.auth, _initSessionForAuthUser);
  }
  if (window.fb && window.fb.auth) _watchAuth();
  else window.addEventListener('fb-ready', _watchAuth, { once: true });

  ChatSystem.on('messages-updated', () => {
    if (!currentSessionId) return;
    const msgs   = ChatSystem.getSessionMessages(currentSessionId);
    const isOpen = chatWindow.classList.contains('open');
    const totalAdmin = msgs.filter(m => m.senderType === 'admin').length;
    const newAdmin   = totalAdmin - _lastSeenAdminMsgCount;

    renderMessages();

    if (isOpen) {
      _lastSeenAdminMsgCount = totalAdmin;
      ChatSystem.markSessionAsRead(currentSessionId);
      unreadBadge.style.display = 'none';
    } else if (newAdmin > 0) {
      unreadBadge.textContent = totalAdmin - _lastSeenAdminMsgCount;
      unreadBadge.style.display = 'flex';
      _playReceiveSound();
    }
  });
});
</script>

/* chat-img lightbox — tap a photo to view it full-size */

  if (!img) return;

    o.onclick = function(){ o.remove(); };
    document.body.appendChild(o);
  }
  o.innerHTML = '<img src="' + src + '" style="max-width:90vw;max-height:90vh;border-radius:10px;">';
});
</script>
