<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zami Mart — Customer Chat</title>
<script type="module" src="firebase-init.js"></script>
<script src="chat-system.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --teal: #063b3f;
  --orange: #FD4D02;
  --cream: #f6f5f0;
  --text: #1a2e2e;
  --text-muted: #6a8080;
  --border: rgba(6,59,63,.1);
  --ease: cubic-bezier(.4,0,.2,1);
  font-family: 'Poppins', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--cream); color: var(--text); font-size: 14px; }

/* =============================================
   CHAT WIDGET BUTTON
   ============================================= */
.chat-widget-btn {
  position: fixed;
  bottom: 28px;
  right: 28px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--orange);
  border: none;
  color: #fff;
  font-size: 1.4rem;
  cursor: pointer;
  box-shadow: 0 8px 32px -8px rgba(253,77,2,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .3s var(--ease);
  z-index: 999;
}
.chat-widget-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 12px 40px -8px rgba(253,77,2,.5);
}
.chat-widget-btn.open {
  background: var(--teal);
}
.chat-unread-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  background: #d6483a;
  color: #fff;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .7rem;
  font-weight: 700;
  border: 2px solid #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}

/* =============================================
   CHAT WINDOW
   ============================================= */
.chat-widget-window {
  position: fixed;
  bottom: 100px;
  right: 28px;
  width: 100%;
  max-width: 400px;
  height: 600px;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 24px 80px -16px rgba(6,59,63,.3);
  display: none;
  flex-direction: column;
  z-index: 998;
  animation: slideUp .3s var(--ease);
}
.chat-widget-window.open {
  display: flex;
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Header */
.chat-header {
  padding: 20px;
  background: var(--teal);
  color: #fff;
  border-radius: 20px 20px 0 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.chat-header-info {
  flex: 1;
}
.chat-header-title {
  font-size: .95rem;
  font-weight: 700;
  margin-bottom: 2px;
}
.chat-header-status {
  font-size: .7rem;
  opacity: .8;
}
.chat-header-close {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: rgba(255,255,255,.15);
  border: none;
  color: #fff;
  font-size: .9rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s var(--ease);
}
.chat-header-close:hover {
  background: rgba(255,255,255,.25);
}

/* Messages Area - Messenger Style */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #fff;
}

/* Message Row */
.chat-message {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  animation: messageIn .25s var(--ease);
  margin-bottom: 0;
}

@keyframes messageIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Admin Messages - Left aligned with avatar */
.chat-message.admin {
  justify-content: flex-start;
}

.chat-message.admin .chat-message-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--teal);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .7rem;
  flex-shrink: 0;
}

.chat-message.admin .chat-message-content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  max-width: 75%;
}

.chat-message.admin .chat-message-bubble {
  background: #FD4D02;
  color: #fff;
  border-radius: 18px;
  padding: 10px 14px;
  word-break: break-word;
  white-space: normal;
  font-size: .82rem;
  line-height: 1.4;
}

.chat-message.admin .chat-message-time {
  font-size: .65rem;
  color: var(--text-muted);
  padding: 0 12px;
}

/* Visitor (Customer) Messages - Right aligned */
.chat-message.visitor {
  justify-content: flex-end;
}

.chat-message.visitor .chat-message-content {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  max-width: 75%;
}

.chat-message.visitor .chat-message-bubble {
  background: #fff;
  color: #1a2e2e;
  border-radius: 18px;
  padding: 10px 14px;
  word-break: break-word;
  white-space: normal;
  font-size: .82rem;
  line-height: 1.4;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

.chat-message.visitor .chat-message-time {
  font-size: .65rem;
  color: var(--text-muted);
  padding: 0 12px;
}

/* Input Area */
.chat-input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  background: #fff;
  align-items: flex-end;
}

.chat-input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: .82rem;
  font-family: inherit;
  outline: none;
  transition: all .2s var(--ease);
  resize: none;
  max-height: 80px;
  min-height: 38px;
}

.chat-input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(6,59,63,.08);
}

.chat-send-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--orange);
  border: none;
  color: #fff;
  font-size: .9rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s var(--ease);
  flex-shrink: 0;
}

.chat-send-btn:hover {
  background: #e34602;
  transform: scale(1.05);
}

.chat-send-btn:active {
  transform: scale(0.95);
}

/* Welcome State */
.chat-welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 20px;
  text-align: center;
}

.chat-welcome-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--orange);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  margin-bottom: 16px;
}

.chat-welcome h3 {
  font-size: .95rem;
  color: var(--teal);
  margin-bottom: 6px;
}

.chat-welcome p {
  font-size: .8rem;
  color: var(--text-muted);
  margin-bottom: 16px;
  line-height: 1.5;
}

.chat-welcome-form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.chat-welcome-form input {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: .82rem;
  font-family: inherit;
  outline: none;
  transition: all .2s var(--ease);
}

.chat-welcome-form input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(6,59,63,.08);
}

.chat-welcome-form button {
  padding: 10px 16px;
  background: var(--orange);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s var(--ease);
}

.chat-welcome-form button:hover {
  background: #e34602;
  transform: translateY(-2px);
}

/* Mobile */
@media (max-width: 480px) {
  .chat-widget-window {
    max-width: calc(100% - 20px);
    height: 500px;
    bottom: 90px;
    right: 10px;
  }
  .chat-widget-btn {
    bottom: 20px;
    right: 20px;
  }
  .chat-message.visitor .chat-message-content,
  .chat-message.admin .chat-message-content {
    max-width: 85%;
  }
}

/* Scrollbar */
.chat-messages::-webkit-scrollbar {
  width: 6px;
}
.chat-messages::-webkit-scrollbar-track {
  background: transparent;
}
.chat-messages::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}
.chat-messages::-webkit-scrollbar-thumb:hover {
  background: rgba(6,59,63,.2);
}
</style>
</head>
<body>

<!-- Chat Widget Button -->
<button class="chat-widget-btn" id="chatWidgetBtn" title="Open Chat">
  <i class="fa-solid fa-message"></i>
  <div class="chat-unread-badge" id="chatUnreadBadge" style="display:none;">0</div>
</button>

<!-- Chat Window -->
<div class="chat-widget-window" id="chatWindow">
  <div class="chat-header">
    <div class="chat-header-info">
      <div class="chat-header-title">Zami Mart Support</div>
      <div class="chat-header-status">Usually replies instantly</div>
    </div>
    <button class="chat-header-close" id="chatCloseBtn"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <!-- Messages Container -->
  <div class="chat-messages" id="chatMessages">
    <div class="chat-welcome">
      <div class="chat-welcome-icon"><i class="fa-solid fa-comment-dots"></i></div>
      <h3>Welcome to Zami Mart!</h3>
      <p>Have a question? We're here to help. Start a conversation below.</p>
      <form class="chat-welcome-form" id="chatWelcomeForm">
        <input type="text" id="visitorName" placeholder="Your name" required>
        <input type="tel" id="visitorPhone" placeholder="Phone number" required>
        <button type="submit">Start Chat</button>
      </form>
    </div>
  </div>

  <!-- Input Area -->
  <div class="chat-input-area">
    <textarea class="chat-input" id="chatInput" placeholder="Type a message..." rows="1" style="display:none;"></textarea>
    <button class="chat-send-btn" id="chatSendBtn" style="display:none;"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
</div>



<!-- Chat Widget Script -->
<script>
'use strict';

const chatBtn = document.getElementById('chatWidgetBtn');
const chatWindow = document.getElementById('chatWindow');
const chatCloseBtn = document.getElementById('chatCloseBtn');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSendBtn');
const chatWelcomeForm = document.getElementById('chatWelcomeForm');
const visitorNameInput = document.getElementById('visitorName');
const visitorPhoneInput = document.getElementById('visitorPhone');
const unreadBadge = document.getElementById('chatUnreadBadge');

let currentSessionId = null;
let visitorName = null;

// Toggle chat window
chatBtn.addEventListener('click', () => {
  chatWindow.classList.toggle('open');
  chatBtn.classList.toggle('open');
  if (chatWindow.classList.contains('open') && currentSessionId) {
    chatInput.focus();
    ChatSystem.markSessionAsRead(currentSessionId);
  }
});

chatCloseBtn.addEventListener('click', () => {
  chatWindow.classList.remove('open');
  chatBtn.classList.remove('open');
});

// Welcome form submission
chatWelcomeForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const name = visitorNameInput.value.trim();
  const phone = visitorPhoneInput.value.trim();

  if (!name) {
    visitorNameInput.focus();
    return;
  }

  visitorName = name;
  currentSessionId = ChatSystem.createSession(name, phone);

  // Hide welcome, show chat
  chatMessages.innerHTML = '';
  chatInput.style.display = 'block';
  chatSendBtn.style.display = 'flex';
  chatWelcomeForm.style.display = 'none';

  // Load existing messages
  renderMessages();
  saveSession();
  chatInput.focus();
});

// Send message
chatSendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || !currentSessionId) return;

  ChatSystem.sendMessage(currentSessionId, 'visitor', visitorName, text);
  chatInput.value = '';
  chatInput.style.height = 'auto';
  renderMessages();
}

// Render messages
function renderMessages() {
  if (!currentSessionId) return;
  const messages = ChatSystem.getSessionMessages(currentSessionId);
  
  chatMessages.innerHTML = messages.map(msg => {
    const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const isAdmin = msg.senderType === 'admin';
    
    if (isAdmin) {
      return `
        <div class="chat-message admin">
          <div class="chat-message-avatar"><i class="fa-solid fa-headset"></i></div>
          <div class="chat-message-content">
            <div class="chat-message-bubble">${escapeHtml(msg.text)}</div>
            <div class="chat-message-time">${time}</div>
          </div>
        </div>
      `;
    } else {
      return `
        <div class="chat-message visitor">
          <div class="chat-message-content">
            <div class="chat-message-bubble">${escapeHtml(msg.text)}</div>
            <div class="chat-message-time">${time}</div>
          </div>
        </div>
      `;
    }
  }).join('');
  
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

// Unread badge
function updateUnreadBadge() {
  if (!currentSessionId) return;
  const count = ChatSystem.getUnreadCount(currentSessionId);
  if (count > 0) {
    unreadBadge.textContent = count;
    unreadBadge.style.display = 'flex';
  } else {
    unreadBadge.style.display = 'none';
  }
}

// Restore session from localStorage (UNIFIED KEY: zm_cv_session)
function restoreSession() {
  const stored = localStorage.getItem('zm_cv_session');
  if (stored) {
    try {
      const session = JSON.parse(stored);
      if (session && session.id && ChatSystem.getSession(session.id)) {
        currentSessionId = session.id;
        visitorName = session.name;
        
        // Hide welcome, show chat
        chatMessages.innerHTML = '';
        chatInput.style.display = 'block';
        chatSendBtn.style.display = 'flex';
        chatWelcomeForm.style.display = 'none';
        
        renderMessages();
        return true;
      }
    } catch (e) {
      console.warn('Failed to restore session', e);
    }
  }
  return false;
}

// Save session (UNIFIED KEY: zm_cv_session)
function saveSession() {
  if (currentSessionId && visitorName) {
    localStorage.setItem('zm_cv_session', JSON.stringify({
      id: currentSessionId,
      name: visitorName
    }));
  }
}

// Utility
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Initialize
ChatSystem.onReady(() => {
  if (!restoreSession()) {
    // Show welcome form
  }
  
  // Listen for updates
  ChatSystem.on('messages-updated', () => {
    if (currentSessionId) {
      renderMessages();
      updateUnreadBadge();
    }
  });
});

// Auto-expand textarea
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = (this.scrollHeight) + 'px';
});

</script>
</body>
</html>
